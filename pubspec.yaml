name: topar_115
description: "Fifteen — Dual-mode (Offline GSM + Online Realtime) Student Group Management App."
publish_to: 'none'

version: 1.0.8+8

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── Core UI ─────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1        # Plus Jakarta Sans — warm, friendly typography
  gap: ^3.0.1                 # Readable spacing widget
  shimmer: ^3.0.0             # Skeleton loading placeholders
  lottie: ^3.1.2              # Micro-animation / celebratory animations

  # ── State Management & Navigation ───────────────────────────────────────────
  flutter_riverpod: ^2.5.1    # Reactive state management
  go_router: ^14.2.7          # Declarative routing (wired in Step 2)

  # ── Native & Permissions ────────────────────────────────────────────────────
  permission_handler: ^11.3.1 # Android SEND_SMS runtime permission

  # ── Internationalization ────────────────────────────────────────────────────
  intl: ^0.20.2               # ARB date/number formatting

  # ── Networking & Cloud API ──────────────────────────────────────────────────
  http: ^1.2.2                # Alwaysdata REST API communication

  # ── Local Storage & Persistence ─────────────────────────────────────────────
  shared_preferences: ^2.2.3  # Remember login session and offline cache

  # ── FUTURE: Firebase (Step 2) ── requires google-services.json ──────────────
  # firebase_core: ^3.4.0
  # cloud_firestore: ^5.4.1
  # firebase_storage: ^12.3.0
  # firebase_auth: ^5.3.0
  # firebase_messaging: ^15.1.0

  # ── FUTURE: AI Tutor / Gemini (Step 3) ──────────────────────────────────────
  # google_generative_ai: ^0.4.6

  # ── FUTURE: Local Cache (Step 3+) ───────────────────────────────────────────
  # hive_flutter: ^1.1.0
  # hive: ^2.2.3

  # ── FUTURE: Media & Networking (Step 2+) ────────────────────────────────────
  # image_picker: ^1.1.2
  # cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true              # Enables flutter gen-l10n for ARB files
