# fly.toml app configuration file generated for Topar-115 FastAPI Server
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "topar115"
primary_region = "fra" # Frankfurt (close to Turkmenistan & Europe, low latency)

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "topar_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
